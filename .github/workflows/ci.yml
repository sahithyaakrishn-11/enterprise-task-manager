name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master

jobs:
  backend:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Check Rust code
        working-directory: backend
        run: cargo check

      - name: Run Rust tests
        working-directory: backend
        run: cargo test

      - name: Build Docker image
        working-directory: backend
        run: docker build -t enterprise-task-manager-backend .