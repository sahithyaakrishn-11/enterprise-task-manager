  backend:
    build:
      context: ./backend
    container_name: enterprise-backend-compose
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgres://postgres:1105@postgres:5432/enterprise_task_manager
      REDIS_URL: redis://redis:6379
      KAFKA_BROKER: kafka:9092
      KEYCLOAK_URL: http://keycloak:8080
      OPENSEARCH_URL: http://opensearch:9200
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      kafka:
        condition: service_started
      keycloak:
        condition: service_started
      opensearch:
        condition: service_started